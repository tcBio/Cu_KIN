name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-cuda:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.14
        with:
          cuda: '12.4.1'

      - name: Configure
        shell: pwsh
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=OFF -DCMAKE_CUDA_ARCHITECTURES=86

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release
